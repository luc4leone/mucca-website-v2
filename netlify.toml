# Sito statico puro: nessun build step, si pubblica la root del repo.
[build]
  publish = "."
  command = ""

# Le guide sulle worktree servono a chi legge il repo su GitHub, non a chi
# visita il sito: restano versionate, ma non sono raggiungibili dal web.
# Un X-Robots-Tag non basterebbe — toglie dai motori, non dalla rete.
[[redirects]]
  from = "/spiega/*"
  to = "/404.html"
  status = 404
  force = true

# L'offerta a Mediaddress è raggiungibile solo da chi ha il link.
[[headers]]
  for = "/offerta-mediaddress/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Indice di servizio: nome non indovinabile + fuori dai motori di ricerca.
[[headers]]
  for = "/index-abf92932.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Journal privato degli annunci analizzati: note di lavoro, non contenuto pubblico.
[[headers]]
  for = "/upwork.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/upwork/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Bozza del caso d'uso in lavorazione + export n8n: materiale di lavoro.
[[headers]]
  for = "/your-third-workflow/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Manifesto: prototipo in lavorazione, fuori dai motori finché non è deciso.
[[headers]]
  for = "/manifesto.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Journal dell'outreach: nomi e profili di persone contattate, non contenuto pubblico.
[[headers]]
  for = "/outreach.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
